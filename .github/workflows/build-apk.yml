name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  release:
    types: [ published, created, edited ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Aurora Notes APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Native Git)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .git
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Configure Pre-installed JDK 21
        run: |
          if [ -n "${JAVA_HOME_21_X64:-}" ] && [ -d "${JAVA_HOME_21_X64}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_21_X64}/bin" >> "$GITHUB_PATH"
          elif [ -d "/usr/lib/jvm/temurin-21-jdk-amd64" ]; then
            echo "JAVA_HOME=/usr/lib/jvm/temurin-21-jdk-amd64" >> "$GITHUB_ENV"
            echo "/usr/lib/jvm/temurin-21-jdk-amd64/bin" >> "$GITHUB_PATH"
          elif [ -n "${JAVA_HOME_17_X64:-}" ] && [ -d "${JAVA_HOME_17_X64}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          fi
          java -version

      - name: Restore Persistent Signing Keystore
        run: |
          if [ -f "app/signing/debug.keystore.b64" ]; then
            echo "Restoring persistent signing keystore from app/signing/debug.keystore.b64..."
            tr -d '[:space:]' < app/signing/debug.keystore.b64 | base64 -d > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Fallback: generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aurora Notes,O=Aurora,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android | head -n 20 || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/Aurora Notes.apk"
          VERSION_TAG="v1.2.${{ github.run_number }}"

          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi

          # 1. If triggered by creating/publishing a Release on GitHub UI
          if [ "${{ github.event_name }}" = "release" ]; then
            TARGET_TAG="${{ github.event.release.tag_name }}"
            echo "Uploading Aurora Notes.apk to Release $TARGET_TAG..."
            gh release upload "$TARGET_TAG" "$APK_PATH#Aurora Notes.apk" --clobber
            exit 0
          fi

          # 2. If triggered by pushing a version tag (e.g. v1.0.0)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TARGET_TAG="${GITHUB_REF#refs/tags/}"
            if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
              echo "Uploading Aurora Notes.apk to existing tag release $TARGET_TAG..."
              gh release upload "$TARGET_TAG" "$APK_PATH#Aurora Notes.apk" --clobber
            else
              echo "Creating new GitHub Release $TARGET_TAG with Aurora Notes.apk..."
              gh release create "$TARGET_TAG" "$APK_PATH#Aurora Notes.apk" \
                --title "Aurora Notes $TARGET_TAG" \
                --generate-notes
            fi
            exit 0
          fi

          # 3. On push to main/master or manual workflow dispatch:
          # Also attach the APK to your existing latest release (if one exists without it or to keep it updated),
          # and create a new numbered release for this build.
          EXISTING_LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$EXISTING_LATEST_TAG" ]; then
            echo "Updating existing release ($EXISTING_LATEST_TAG) with latest Aurora Notes.apk..."
            gh release upload "$EXISTING_LATEST_TAG" "$APK_PATH#Aurora Notes.apk" --clobber || true
          fi

          echo "Creating new GitHub Release $VERSION_TAG with Aurora Notes.apk..."
          gh release create "$VERSION_TAG" "$APK_PATH#Aurora Notes.apk" \
            --title "Aurora Notes $VERSION_TAG" \
            --notes "Automated build (#${{ github.run_number }}) of **Aurora Notes.apk**. Download and install directly over your existing app to update without losing notes." \
            --latest

