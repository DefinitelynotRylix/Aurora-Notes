name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Restore Persistent Signing Keystore
        run: |
          if [ -f "app/signing/debug.keystore.b64" ]; then
            echo "Restoring persistent signing keystore from app/signing/debug.keystore.b64..."
            tr -d '[:space:]' < app/signing/debug.keystore.b64 | base64 -d > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Fallback: generating debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Aurora Notes,O=Aurora,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android | head -n 20 || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora Notes
          path: app/build/outputs/apk/debug/Aurora Notes.apk
          retention-days: 14
